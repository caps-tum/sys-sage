version: '3'
services:
  test:
    build:
      context: test
      dockerfile: Dockerfile
    volumes:
      - .:/sys-sage
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        cmake -S /sys-sage -B /sys-sage-build -DCMAKE_BUILD_TYPE=Debug -DPAPI=ON
        cmake --build /sys-sage-build --parallel
        cmake --install /sys-sage-build --prefix /usr
        cmake -S /sys-sage/test -B /test-build -DCMAKE_BUILD_TYPE=Debug
        cmake --build /test-build --parallel
        /test-build/test
        python3 -m venv /virt
        /virt/bin/python -m pip install /sys-sage/python
        /virt/bin/python /sys-sage/test/topology.py
        /virt/bin/python /sys-sage/test/relation.py
        /virt/bin/python /sys-sage/test/datapath.py
