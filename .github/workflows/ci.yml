on:
  push:
    branches:
      - '**'       # matches any branch
  pull_request:
    branches:
      - '**'       # matches any PR target branch
# the workflow only needs to read the repository
permissions:
  contents: read
# a new push to a branch (or PR) cancels the still running CI of the older commit
# master and develop get a group per commit, so there every commit is tested
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Unit Tests (${{ matrix.compiler }}, ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # g++-12 is the oldest supported GCC (see CMakeLists.txt)
        compiler: [g++, clang++, g++-12]
        runner: [ubuntu-latest]
        # aarch64 (there is no ubuntu-latest-arm, so the version is pinned)
        include:
          - compiler: g++
            runner: ubuntu-26.04-arm
    uses: ./.github/workflows/test.yml
    with:
      compiler: ${{ matrix.compiler }}
      runner: ${{ matrix.runner }}

  asan:
    name: Address Sanitizer
    needs: test
    uses: ./.github/workflows/test.yml
    with:
      flags: -DTEST_ASAN=ON
      sanitizer: address

  tsan:
    name: Thread Sanitizer
    needs: test
    uses: ./.github/workflows/test.yml
    with:
      flags: -DTEST_TSAN=ON
      sanitizer: thread

  ubsan:
    name: Undefined Behaviour Sanitizer
    needs: test
    uses: ./.github/workflows/test.yml
    with:
      flags: -DTEST_UBSAN=ON
      sanitizer: undefined
  #  check documentation CI so that unnecessary files (.cpp, examples/,...) can be left out    
  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Sync packages
        run: sudo apt-get update

      - name: Install Doxygen
        run: sudo apt-get install -y doxygen

      - name: Install coverxygen
        run: pip3 install coverxygen

      - name: Generate documentation
        run: cd docs && doxygen Doxyfile

      - name: Documentation coverage
        # Exclude parsers, external_interfaces, examples, data-sources and .cpp files
        run: cd docs && python3 -m coverxygen --verbose --xml-dir xml --src-dir ../src/ --output doc-coverage.info --format json-v3 --scope public,protected --kind enum,enumvalue,friend,typedef,function,class,struct,union,define,file,namespace --exclude '.*\/parsers\/.*' --exclude '.*\/external_interfaces\/.*' --exclude '.*\/examples\/.*' --exclude '.*\/data-sources\/.*' --exclude '.*\.cpp$'

      - name: Check documentation completeness
        run: cd docs && ./check_docs.sh
