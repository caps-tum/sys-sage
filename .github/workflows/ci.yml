name: CI

# Builds sys-sage, installs it, and runs the C++ unit tests (boost-ext/ut) and the
# Python binding tests. The same tests also run under the address, thread and
# undefined-behaviour sanitizers, with the library itself instrumented as well.
# A separate job checks the Doxygen documentation coverage.

# Runs on every push to develop/master and on every pull request (any target
# branch, including PRs from forks). Pushes to feature branches are not built
# separately; their PR runs cover them, so each commit is not built twice.
on:
  workflow_dispatch:
  push:
    branches: [ develop, master ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.compiler }}${{ matrix.sanitizer && format(', {0} sanitizer', matrix.sanitizer) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc,   cc: gcc,   cxx: g++ }
          - { compiler: clang, cc: clang, cxx: clang++ }
          - { compiler: gcc,   cc: gcc,   cxx: g++, sanitizer: address }
          - { compiler: gcc,   cc: gcc,   cxx: g++, sanitizer: thread }
          - { compiler: gcc,   cc: gcc,   cxx: g++, sanitizer: undefined }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # Applied to both the library and the tests, so sanitizers also see the
      # library code. -fno-sanitize-recover makes UBSan findings fail the run
      # (by default UBSan only prints them).
      SAN_FLAGS: ${{ matrix.sanitizer && format('-fsanitize={0} -fno-sanitize-recover=all -fno-omit-frame-pointer -g', matrix.sanitizer) || '' }}

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            g++ clang cmake \
            libxml2-dev nlohmann-json3-dev libhwloc-dev hwloc libnuma-dev libpapi-dev \
            python3-dev python3-venv pybind11-dev pybind11-json-dev

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Only the test framework is needed; the mt4g submodule (data source, DS_MT4G)
      # is not built here.
      - name: Fetch ut submodule
        run: git submodule update --init --depth 1 test/ut

      - name: Configure library
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DPROC_CPUINFO=ON -DDS_HWLOC=ON -DDS_NUMA=ON -DPAPI=ON \
            -DCMAKE_CXX_FLAGS="$SAN_FLAGS"

      - name: Build library
        run: cmake --build build --parallel

      - name: Install library
        run: sudo cmake --install build --prefix /usr

      - name: Configure tests
        run: cmake -S test -B test/build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="$SAN_FLAGS"

      - name: Build tests
        run: cmake --build test/build --parallel

      - name: Run C++ tests
        run: ./test/build/test

      - name: Build and install Python module
        run: |
          python3 -m venv venv
          ./venv/bin/python -m pip install ./python

      # The Python interpreter is not instrumented, so in sanitizer builds the
      # sanitizer runtime used by libsys-sage is preloaded (ASan and TSan require
      # it to be loaded first). Leak detection is off: it would report the
      # interpreter's own allocations.
      - name: Run Python tests
        run: |
          case "${{ matrix.sanitizer }}" in
            address) export LD_PRELOAD="$($CXX -print-file-name=libasan.so)" ASAN_OPTIONS=detect_leaks=0 ;;
            thread)  export LD_PRELOAD="$($CXX -print-file-name=libtsan.so)" ;;
          esac
          ./venv/bin/python test/topology.py
          ./venv/bin/python test/relation.py
          ./venv/bin/python test/datapath.py

  # Fails if public API in src/ (excluding parsers, external interfaces, examples,
  # data sources and .cpp files) is undocumented.
  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends doxygen

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install coverxygen
        run: |
          python3 -m venv venv
          ./venv/bin/pip install coverxygen

      - name: Generate documentation
        working-directory: docs
        run: doxygen Doxyfile

      - name: Documentation coverage
        working-directory: docs
        run: |
          ../venv/bin/python -m coverxygen --verbose --xml-dir xml --src-dir ../src/ \
            --output doc-coverage.info --format json-v3 --scope public,protected \
            --kind enum,enumvalue,friend,typedef,function,class,struct,union,define,file,namespace \
            --exclude '.*\/parsers\/.*' --exclude '.*\/external_interfaces\/.*' \
            --exclude '.*\/examples\/.*' --exclude '.*\/data-sources\/.*' --exclude '.*\.cpp$'

      - name: Check documentation completeness
        working-directory: docs
        run: ./check_docs.sh
