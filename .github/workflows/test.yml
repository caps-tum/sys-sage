on:
  workflow_call:
    inputs:
      flags:
        type: string
        default: ''
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true
        
      - name: Syncing packages
        run: sudo apt-get update
      - name: Get build tools
        run: sudo apt-get install -yy g++ cmake
      - name: Get dependecies
        run: 
             |
             sudo apt-get install -yy libxml2-dev nlohmann-json3-dev python3-dev pybind11-dev libpapi-dev
             wget -P /tmp https://github.com/boost-ext/ut/archive/refs/tags/v2.3.1.tar.gz
             tar -C /tmp -xzf /tmp/v2.3.1.tar.gz
             cmake -S /tmp/ut-2.3.1 -B /tmp/ut-2.3.1/build -DBOOST_UT_BUILD_EXAMPLES=OFF -DBOOST_UT_BUILD_TESTS=OFF
             cmake --build /tmp/ut-2.3.1/build
             sudo cmake --install /tmp/ut-2.3.1/build
      - name: Configure library
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DPAPI=ON # TODO: add more flags in the future
      - name: Build library
        run: cmake --build build --prallel
      - name: Install library
        run: cmake --install build
      - name: Get boost-ext-ut
        run: 
      - name: Configure tests
        run: cmake -S test -B test/build -DCMAKE_BUILD_TYPE=Debug ${{ inputs.flags }}
      - name: Build tests
        run: cmake --build test/build --parallel
      - name: Run tests
        run: ./test/build/test
      #- name: Python tests
      #  run:  |
      #        PYTHONPATH=$(echo ./inst-dir/lib/python*/site-packages) python3 test/topology.py
      #        PYTHONPATH=$(echo ./inst-dir/lib/python*/site-packages) python3 test/datapath.py
      #        PYTHONPATH=$(echo ./inst-dir/lib/python*/site-packages) python3 test/relation.py