on:
  workflow_call:
    inputs:
      flags:
        type: string
        default: ''
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true
        
      - name: Syncing packages
        run: sudo apt-get update
      - name: Get build tools
        run: sudo apt-get install -yy g++ cmake
      - name: Get dependecies
        run: sudo apt-get install -yy libxml2-dev nlohmann-json3-dev python3-dev python3-venv pybind11-dev pybind11-json-dev libpapi-dev hwloc libhwloc-common libhwloc-dev
      - name: Configure library
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DPROC_CPUINFO=ON -DDS_HWLOC=ON -DDS_NUMA=ON -DPAPI=ON
      - name: Build library
        run: cmake --build build --parallel
      - name: Install library
        run: sudo cmake --install build --prefix /usr
      - name: Configure tests
        run: cmake -S test -B test/build -DCMAKE_BUILD_TYPE=Debug ${{ inputs.flags }}
      - name: Build library tests
        run: cmake --build test/build
      - name: Run library tests
        run: ./test/build/test
      - name: Create virtual environment
        run: python3 -m venv ./venv
      - name: Build & Install Python module
        run: ./venv/bin/python -m pip install ./python
      - name: Run Python module tests
        run: |
             ./venv/bin/python test/topology.py
             ./venv/bin/python test/relation.py
             ./venv/bin/python test/datapath.py